<div class="login-split">

  <div class="login-left">
    <div class="left-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="13" y="4" width="6" height="24" rx="3" fill="white"/>
          <rect x="4" y="13" width="24" height="6" rx="3" fill="white"/>
        </svg>
      </div>
      <div class="left-brand-text">
        <h1>VaccDSS</h1>
        <p>Vaccination Decision Support System</p>
      </div>
    </div>

    <div class="left-body">
      <h2>Smarter vaccine<br>allocation decisions</h2>
      <p>Use the AHP model to distribute vaccines across institutions based on real patient data, risk levels, and logistical factors.</p>
    </div>

    <div class="left-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

  <div class="login-right">
    <div class="form-wrap">
      <div class="form-head">
        <h2>Welcome back</h2>
        <p>Sign in to access the dashboard</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field field-email">
          <label for="email">Email address</label>
          <input id="email" type="email" formControlName="email" placeholder="admin@example.com" autocomplete="email">
        </div>

        <div class="field field-password">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" [type]="showPassword ? 'text' : 'password'"
                   formControlName="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="toggle-pw" (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              @if (showPassword) {
                <!-- eye-off -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              } @else {
                <!-- eye -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              }
            </button>
          </div>
        </div>

        @if (errorMessage) {
          <div class="error-msg">{{ errorMessage }}</div>
        }

        <button type="submit" class="btn-login" [class.is-loading]="loading" [disabled]="loading">
          @if (loading) {
            <span class="spinner"></span>
          } @else {
            Sign in →
          }
        </button>
      </form>
    </div>
  </div>

</div>
