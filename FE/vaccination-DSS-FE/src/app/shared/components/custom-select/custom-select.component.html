<div class="cs-wrap" [class.open]="open" [class.disabled]="disabled" [class.has-value]="value !== ''" (click)="$event.stopPropagation()">
  <button type="button" class="cs-trigger" (click)="toggle()">
    <span class="cs-value" [class.cs-placeholder]="!selectedLabel">
      {{ selectedLabel || placeholder }}
    </span>
    <svg class="cs-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>
  @if (open) {
    <div class="cs-dropdown">
      @for (opt of options; track opt.value) {
        <button type="button" class="cs-option" [class.selected]="opt.value === value" (click)="select(opt.value)">
          {{ opt.label }}
        </button>
      }
    </div>
  }
</div>
