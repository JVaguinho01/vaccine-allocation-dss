<aside class="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="13" y="4" width="6" height="24" rx="3" fill="white"/>
          <rect x="4" y="13" width="24" height="6" rx="3" fill="white"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">VaccDSS</div>
        <div class="brand-sub">Decision Support System</div>
      </div>
    </div>
  </div>

  <nav class="nav">
    <div class="nav-section-label">Main</div>

    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Dashboard</span>
    </a>

    <div class="nav-section-label">Data</div>

    <a routerLink="/regions" routerLinkActive="active" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span>Regions</span>
    </a>

    <a routerLink="/institutions" routerLinkActive="active" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Institutions</span>
    </a>

    <a routerLink="/patients" routerLinkActive="active" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Patients</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <div class="avatar">{{ auth.role() === 'admin' ? 'A' : 'U' }}</div>
      <div class="user-meta">
        <div class="user-name">{{ auth.role() === 'admin' ? 'Administrator' : 'User' }}</div>
        <div class="user-role">{{ auth.role() }}</div>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()" title="Logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>
</aside>
